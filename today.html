<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>오늘 브리핑</title>
<style>
  :root{
    --bg:#f4f5f7;--card:#ffffff;--line:#eceef2;--text:#1c1f26;--sub:#8a909c;--sub2:#5f6570;
    --green:#12a150;--orange:#c2740b;--blue:#2563eb;--purple:#7c3aed;--red:#d32f2f;
    --chip-bg:#f2f3f6;--shadow:0 1px 2px rgba(20,24,32,.04),0 6px 18px rgba(20,24,32,.045);
    --pill:#1c1f26;--pill-text:#fff;
  }
  [data-theme="dark"]{
    --bg:#0f1115;--card:#191c22;--line:#262a33;--text:#ecedf1;--sub:#8b919d;--sub2:#b3b8c2;
    --green:#3ddc84;--orange:#f0a44a;--blue:#6ea8ff;--purple:#b79cff;--red:#ff6b6b;
    --chip-bg:#22262e;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --pill:#ecedf1;--pill-text:#14171c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:15px;line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased;
    transition:background .2s ease,color .2s ease;
  }
  .app{max-width:480px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 0 12px}
  h1{font-size:22px;letter-spacing:-.5px;margin:0;font-weight:800}
  .basis{font-size:11.5px;color:var(--sub);margin-top:4px;letter-spacing:-.1px}
  .theme-btn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--sub2);font-size:16px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
  nav.boards{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding-bottom:2px}
  nav.boards::-webkit-scrollbar{display:none}
  nav.boards a{flex:0 0 auto;font-size:11px;font-weight:700;text-decoration:none;color:var(--sub2);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 9px;letter-spacing:-.2px}
  nav.boards a.here{background:var(--pill);color:var(--pill-text);border-color:var(--pill)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .k{font-size:12.5px;color:var(--sub2);font-weight:600;letter-spacing:-.2px}
  .v{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
  .v small{font-size:12.5px;font-weight:700;margin-left:1px}
  .s{font-size:11.5px;color:var(--sub);margin-top:5px;letter-spacing:-.15px;line-height:1.4}
  .c-green{color:var(--green)}.c-orange{color:var(--orange)}.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-purple{color:var(--purple)}
  .sec-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.2px;margin:20px 2px 8px;display:flex;align-items:center;gap:6px}
  .sec-label span{font-weight:500}
  .blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .blk + .blk{margin-top:10px}
  .blk-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .blk-h .bt{font-size:14px;font-weight:800;letter-spacing:-.4px}
  .blk-h .bs{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:-.15px}
  .blk-h a{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:800;color:var(--blue);text-decoration:none;letter-spacing:-.2px}
  .blk.acc{padding:0;overflow:hidden}
  .blk.acc summary{list-style:none;cursor:pointer;padding:11px 14px;display:block}
  .blk.acc summary::-webkit-details-marker{display:none}
  .blk.acc .bh{display:flex;align-items:center;gap:6px}
  .blk.acc .bt{font-size:13.5px;font-weight:800;letter-spacing:-.4px}
  .blk.acc .bgo{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--blue);
    text-decoration:none;letter-spacing:-.2px;border:1px solid var(--line);background:var(--chip-bg);
    border-radius:999px;padding:2px 7px}
  .blk.acc .bsum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:11.5px;color:var(--sub2);margin-top:3px;line-height:1.4;letter-spacing:-.2px}
  .blk.acc[open] .bsum{display:none}
  .blk.acc .bdy{padding:0 14px 13px;border-top:1px solid var(--line);margin-top:2px;padding-top:10px}
  .allbtn{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--sub2);
    border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:-.2px}
  .line{font-size:13px;letter-spacing:-.25px;line-height:1.55;color:var(--text)}
  .line + .line{margin-top:5px}
  .line b{font-weight:800}
  .line .muted{color:var(--sub)}
  .li{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;letter-spacing:-.2px;line-height:1.5}
  .li:first-child{border-top:0;padding-top:0}
  .li .lk{flex:0 0 auto;min-width:44px;color:var(--sub);font-weight:800;font-size:11.5px;letter-spacing:-.2px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .li .lv{min-width:0}
  .li .lv b{font-weight:800}
  .li .lv .d{display:block;color:var(--sub);font-size:11.5px;margin-top:2px;line-height:1.45}
  .li a{color:var(--blue);font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:-.1px;border-radius:6px;padding:2px 6px;
    background:var(--chip-bg);border:1px solid var(--line);color:var(--sub2);margin-right:5px;white-space:nowrap}
  .tag.g{color:var(--green)}.tag.o{color:var(--orange)}.tag.b{color:var(--blue)}.tag.r{color:var(--red)}
  .attr{font-size:10.5px;color:var(--sub);letter-spacing:-.1px}
  .attr a{color:var(--sub);text-decoration:none;border-bottom:1px dotted var(--sub)}
  .sum-note{font-size:11.5px;color:var(--sub);margin-top:10px;letter-spacing:-.15px;line-height:1.5}
  .info{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
    font-size:11.5px;color:var(--sub);letter-spacing:-.15px;line-height:1.55}
  .info > b{color:var(--sub2);display:block;margin-bottom:4px;font-size:12px}
  .info ul{margin:0;padding-left:15px}
  .info li{margin:2px 0}
  footer{text-align:center;font-size:11px;color:var(--sub);margin-top:20px;line-height:1.6;letter-spacing:-.1px}
  .hidden{display:none!important}
  /* ── 오늘 핵심 3줄 타임라인 ───────────────────────────── */
  .tl3{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px 11px;
    box-shadow:var(--shadow);margin:0 0 12px}
  .tl3-h{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .tl3-h b{font-size:14px;font-weight:800;letter-spacing:-.35px}
  .tl3-h span{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:-.15px}
  .tl3-row{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
  .tl3-row:first-of-type{border-top:0;padding-top:0}
  .tl3-n{flex:0 0 17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;
    background:var(--chip-bg);color:var(--sub2);margin-top:1px;font-variant-numeric:tabular-nums}
  .tl3-row.w .tl3-n{background:#eef4ff;color:#2554b8}
  .tl3-row.h .tl3-n{background:#fff5e0;color:#8a5a00}
  .tl3-row.c .tl3-n{background:#fdecec;color:#b3261e}
  [data-theme="dark"] .tl3-row.w .tl3-n{background:#1b2a45;color:#a8c6ff}
  [data-theme="dark"] .tl3-row.h .tl3-n{background:#3a2c12;color:#ffd08a}
  [data-theme="dark"] .tl3-row.c .tl3-n{background:#3a1c1c;color:#ffb3b3}
  .tl3-b{min-width:0;flex:1}
  .tl3-t{font-size:13px;font-weight:800;letter-spacing:-.3px;line-height:1.35}
  .tl3-t em{font-style:normal;font-variant-numeric:tabular-nums;margin-right:4px}
  .tl3-t em + em{margin-left:2px}
  .tl3-s{font-size:11px;color:var(--sub);margin-top:2px;letter-spacing:-.15px;line-height:1.4}
  .tl3-s b{color:var(--sub2);font-weight:800}
  .tl3-k{flex:0 0 auto;font-size:9.5px;font-weight:900;letter-spacing:-.2px;border-radius:5px;padding:2px 5px;
    background:var(--chip-bg);border:1px solid var(--line);color:var(--sub2);margin-top:1px}
  .tl3-row.c .tl3-k{color:#b3261e;background:#fdecec;border-color:#f6cfcd}
  [data-theme="dark"] .tl3-row.c .tl3-k{color:#ffb3b3;background:#3a1c1c;border-color:#5c2b29}
  /* ── 오늘 마감 · 결정 필요 박스 ─────────────────────── */
  .dc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px 11px;
    box-shadow:var(--shadow);margin:0 0 12px}
  .dc-h{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .dc-h b{font-size:14px;font-weight:800;letter-spacing:-.35px}
  .dc-h span{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:-.15px}
  .dc-h .dc-n{margin-left:auto;font-size:10px;font-weight:900;letter-spacing:-.2px;color:var(--sub2);
    background:var(--chip-bg);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .dc-i{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
  .dc-i:first-of-type{border-top:0;padding-top:0}
  .dc-s{flex:0 0 auto;font-size:9.5px;font-weight:900;letter-spacing:-.2px;border-radius:5px;padding:2px 5px;margin-top:1px;
    background:var(--chip-bg);border:1px solid var(--line);color:var(--sub2);white-space:nowrap}
  .dc-i.done .dc-s{color:#12805a;background:#e8f8f1;border-color:#c6eedd}
  .dc-i.wait .dc-s{color:#8a5a00;background:#fff5e0;border-color:#ffe2ad}
  [data-theme="dark"] .dc-i.done .dc-s{color:#9ff0cd;background:#12302a;border-color:#1e4d41}
  [data-theme="dark"] .dc-i.wait .dc-s{color:#ffd08a;background:#3a2c12;border-color:#5a4419}
  .dc-b{min-width:0;flex:1}
  .dc-t{font-size:13px;font-weight:800;letter-spacing:-.3px;line-height:1.35}
  .dc-i.done .dc-t{color:var(--sub2)}
  .dc-d{font-size:11.5px;color:var(--sub);margin-top:2px;letter-spacing:-.15px;line-height:1.4}
  .dc-d b{color:var(--sub2);font-weight:800}
  .dc-d a{color:var(--blue);font-weight:800;text-decoration:none}
  .dc-f{font-size:10.5px;color:var(--sub);margin-top:8px;letter-spacing:-.15px;line-height:1.45}
  /* ── 처리 완료 (결정 반영분) ─────────────────────────── */
  .dc-lbl{font-size:10.5px;font-weight:900;color:var(--sub);letter-spacing:-.1px;margin:11px 0 3px;
    padding-top:9px;border-top:1px dashed var(--line)}
  .dc-on{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;color:var(--sub2);
    letter-spacing:-.15px;line-height:1.45;padding:3px 0}
  .dc-on .ck{flex:0 0 auto;font-size:9.5px;font-weight:900;letter-spacing:-.2px;border-radius:5px;padding:1px 5px;margin-top:1px;
    color:#12805a;background:#e8f8f1;border:1px solid #c6eedd;white-space:nowrap}
  [data-theme="dark"] .dc-on .ck{color:#9ff0cd;background:#12302a;border-color:#1e4d41}
  .dc-on b{font-weight:800;color:var(--sub2)}
  /* ── 결정 버튼 · 메모 입력 (응답 자동 저장) ───────────── */
  .dc-note{font-size:10px;color:var(--sub);letter-spacing:-.15px;margin:-4px 0 8px}
  .dc-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .dc-opt{flex:0 0 auto;min-height:34px;border:1px solid var(--line);background:var(--chip-bg);color:var(--sub2);
    border-radius:10px;padding:6px 11px;font-size:12px;font-weight:800;font-family:inherit;letter-spacing:-.2px;
    cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;touch-action:manipulation}
  .dc-opt:active{transform:scale(.985)}
  .dc-opt.on{background:var(--pill);color:var(--pill-text);border-color:var(--pill)}
  .dc-memo{display:flex;gap:6px;margin-top:6px}
  .dc-in{flex:1 1 auto;min-width:0;min-height:34px;border:1px solid var(--line);background:var(--bg);color:var(--text);
    border-radius:10px;padding:7px 10px;font-size:13px;font-family:inherit;letter-spacing:-.2px}
  .dc-in::placeholder{color:var(--sub)}
  .dc-in:focus{outline:none;border-color:var(--blue)}
  .dc-save{flex:0 0 auto;min-height:34px;border:1px solid var(--line);background:var(--card);color:var(--blue);
    border-radius:10px;padding:6px 12px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;
    letter-spacing:-.2px;touch-action:manipulation}
  .dc-save:active{transform:scale(.985)}
  .dc-st{display:block;font-size:10.5px;font-weight:800;color:var(--green);margin-top:6px;letter-spacing:-.2px}
  .dc-st.err{color:var(--red)}
  .dc-free{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  /* 8대 항목 강조 배지 */
  .hb{font-size:9.5px;font-weight:900;letter-spacing:-.2px;border-radius:5px;padding:2px 5px;white-space:nowrap;
    background:var(--chip-bg);border:1px solid var(--line);color:var(--sub2)}
  .hb.w{color:#8a5a00;background:#fff5e0;border-color:#ffe2ad}
  .hb.r{color:#b3261e;background:#fdecec;border-color:#f6cfcd}
  [data-theme="dark"] .hb.w{color:#ffd08a;background:#3a2c12;border-color:#5a4419}
  [data-theme="dark"] .hb.r{color:#ffb3b3;background:#3a1c1c;border-color:#5c2b29}
  /* ── 날짜 선택기 · 과거 기록 ─────────────────────────── */
  .datebar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
  .datebar .dl{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:-.1px}
  .datebar select{flex:1 1 auto;min-width:0;max-width:100%;appearance:none;-webkit-appearance:none;
    border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;
    padding:9px 30px 9px 11px;font-size:13.5px;font-weight:700;font-family:inherit;letter-spacing:-.2px;
    cursor:pointer;box-shadow:var(--shadow)}
  .datebar select:disabled{opacity:.6}
  .pastbanner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff8e6;border:1px solid #ffe2ad;
    color:#8a5a00;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;letter-spacing:-.2px;margin:0 0 12px}
  [data-theme="dark"] .pastbanner{background:#2f2513;border-color:#5a4419;color:#ffd08a}
  .pastbanner button{margin-left:auto;border:1px solid currentColor;background:transparent;color:inherit;
    border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer}
  .arch-date{font-size:11.5px;font-weight:700;color:var(--sub);margin:2px 2px 7px;letter-spacing:-.15px}
  .arch-sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    box-shadow:var(--shadow);font-size:13px;letter-spacing:-.2px;line-height:1.5}
  .loadnote{font-size:12px;color:var(--sub);padding:10px 2px;line-height:1.5}
  /* ── 6·7번 요약 행 (공모주·ISA / 공고) ───────────────── */
  .sx{padding:9px 0 0;margin:0}
  .sx:first-child{padding-top:0}
  .sx + .sx{border-top:1px solid var(--line);margin-top:9px}
  .sx-h{display:flex;align-items:baseline;gap:8px}
  .sx-n{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:800;letter-spacing:-.25px;line-height:1.3;word-break:keep-all}
  .sx-p{flex:0 0 auto;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap}
  .sx-b{display:inline-block;flex:0 0 auto;font-size:10px;font-weight:900;letter-spacing:-.2px;border-radius:5px;
    padding:1px 5px;border:1px solid var(--line);background:var(--chip-bg);color:var(--sub2);white-space:nowrap}
  .sx-p .sx-b{margin-left:4px;vertical-align:1px}
  .sx-b.g{color:#0f7a3d;background:#e9f8ef;border-color:#c7ecd8}
  .sx-b.r{color:#b3261e;background:#fdecec;border-color:#f6cfcd}
  .sx-b.o{color:#8a5a00;background:#fff5e0;border-color:#ffe2ad}
  [data-theme="dark"] .sx-b.g{color:#9ff0cd;background:#12302a;border-color:#1e4d41}
  [data-theme="dark"] .sx-b.r{color:#ffb3b3;background:#3a1c1c;border-color:#5c2b29}
  [data-theme="dark"] .sx-b.o{color:#ffd08a;background:#3a2c12;border-color:#5a4419}
  .sx-m{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--sub2);
    letter-spacing:-.15px;line-height:1.45;margin-top:3px}
  .sx-m .l{min-width:0;flex:1 1 auto}
  .sx-m .r{flex:0 0 auto;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
  .sx-m .l.b{font-weight:800;color:var(--sub2)}
  .sxn{font-size:10.5px;color:var(--sub);letter-spacing:-.15px;line-height:1.45;margin-top:4px}
  .sgx{margin-top:11px;padding:9px 11px;border:1px solid var(--line);background:var(--chip-bg);border-radius:12px}
  .sg{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-size:11.5px;letter-spacing:-.15px;line-height:1.5}
  .sg + .sg{margin-top:3px}
  .sg .k{flex:0 0 auto;color:var(--sub);font-weight:700;font-size:11.5px}
  .sg .v{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .sxl{font-size:10.5px;font-weight:900;color:var(--sub);letter-spacing:-.1px;margin:12px 0 5px}
  .sxt{font-size:11.5px;color:var(--sub2);letter-spacing:-.15px;line-height:1.5}
  .sxt + .sxt{margin-top:2px}
  .sxt b{font-weight:800;color:var(--text)}
  .sxt.sub{color:var(--sub)}
  .smk{display:flex;gap:6px;margin-bottom:6px}
  .smk > div{flex:1 1 0;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
  .smk .k{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:-.1px}
  .smk .v{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.25px;margin-top:1px;white-space:nowrap}
  .smk em{font-style:normal;font-size:10px;font-weight:900;margin-left:3px}
  .smk em.up{color:var(--green)}
  .smk em.dn{color:var(--red)}
  .sxm{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 0}
  .sxm span{font-size:10.5px;font-weight:800;letter-spacing:-.2px;border-radius:6px;padding:2px 6px;
    background:var(--chip-bg);border:1px solid var(--line);color:var(--sub2);white-space:nowrap}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div>
      <h1>오늘 브리핑</h1>

function txt(v){ return Array.isArray(v) ? v.join(" · ") : (v == null ? "" : String(v)); }

function isaHTML(isa){
  const rows = isa.rows || [];
  const rowsHTML = rows.map(r => {
    const ch = String(r.ch || ""), pl = String(r.pl || "");
    return `<div class="sx">
      <div class="sx-h"><b class="sx-n">${esc(r.n)}</b><span class="sx-p">${esc(r.p)}<span class="sx-b ${ch.indexOf("-") === 0 ? "r" : "g"}">${esc(ch)}</span></span></div>
      <div class="sx-m"><span class="l">${esc(r.q)}</span></div>
      <div class="sx-m"><span class="l">평가 ${esc(r.val)}</span><span class="r ${pl.indexOf("-") === 0 ? "c-red" : "c-green"}">${esc(pl)}</span></div>
    </div>`;
  }).join("");
  const s = isa.sum || null;
  const sumHTML = s
    ? `<div class="sgx">
      <div class="sg"><span class="k">총 평가액</span><span class="v">${esc(s.val)}</span></div>
      <div class="sg"><span class="k">평가손익</span><span class="v ${String(s.pl).indexOf("-") === 0 ? "c-red" : "c-green"}">${esc(s.pl)}</span></div>
      <div class="sg"><span class="k">전일 대비</span><span class="v ${String(s.day).indexOf("-") === 0 ? "c-red" : "c-green"}">${esc(s.day)}</span></div>
      <div class="sg"><span class="k">매입원가</span><span class="v">${esc(s.cost)}</span></div>
    </div>`
    : (isa.total ? `<div class="line" style="margin-top:8px"><b>${esc(isa.total)}</b></div>` : "");
  const mk = isa.market || [];
  const mkHTML = mk.length ? `<div class="smk">${mk.map(m => {
      const ch = String(m.ch || "");
      return `<div><div class="k">${esc(m.k)}</div><div class="v">${esc(m.v)}<em class="${ch.indexOf("-") === 0 ? "dn" : "up"}">${esc(ch)}</em></div></div>`;
    }).join("")}</div>` : "";
  const outlooks = Array.isArray(isa.outlook) ? isa.outlook : (isa.outlook ? [isa.outlook] : []);
  const outlookHTML = (mkHTML || outlooks.length)
    ? `<div class="sxl">오늘 전망</div>${mkHTML}${outlooks.map(x => `<div class="sxt">${esc(x)}</div>`).join("")}` : "";
  const sg = isa.signal || null;
  const sigHTML = (sg && sg.head)
    ? `<div class="sxl">판단</div>
       <div class="sxt"><b>${esc(sg.head)}</b></div>
       ${(sg.items || []).length ? `<div class="sxm">${(sg.items || []).map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
       ${sg.note ? `<div class="sxt sub" style="margin-top:5px">${esc(sg.note)}</div>` : ""}`
    : (isa.signal ? `<div class="sxl">판단</div><div class="sxt">${esc(txt(isa.signal))}</div>` : "");
  const st = Array.isArray(isa.stocks) ? isa.stocks : (isa.stocks ? [isa.stocks] : []);
  const stockHTML = st.length ? `<div class="sxl">공모주</div>${st.map(x => `<div class="sxt">${esc(x)}</div>`).join("")}` : "";
  return rowsHTML + sumHTML + outlookHTML + sigHTML + stockHTML;
}

/* ── 오늘 마감 · 결정 필요 (맨 위 고정 박스) ───────────── */
function decideHTML(d, live){
  const items = (d && d.items) || [];
  const doneItems = (d && d.done) || [];
  if(!items.length && !doneItems.length) return "";
  const doneOf = x => x.s === "done" || (live && !!(DEC_STATE[decName(x)] || {}).sentAt);
  const wait = items.filter(x => !doneOf(x)).length;
  return `<div class="dc" data-live="${live ? 1 : 0}" role="region" aria-label="오늘 마감·결정 필요">
    <div class="dc-h"><b>오늘 마감 · 결정 필요</b><span>${esc(d.basis || "")}</span>
      <span class="dc-n">${wait ? wait + "건 대기" : "전부 처리"}</span></div>
    ${live ? `<div class="dc-note">버튼을 누르면 선택과 함께 저장 · 메모는 적고 [저장]</div>` : ""}
    ${items.map((x, i) => `<div class="dc-i ${doneOf(x) ? "done" : "wait"}">
      <span class="dc-s">${doneOf(x) ? "완료" : "대기"}</span>
      <div class="dc-b"><div class="dc-t">${esc(x.t)}</div><div class="dc-d">${x.d || ""}</div>${live ? decCtrl(i) : ""}</div>
    </div>`).join("")}
    ${doneItems.length ? `<div class="dc-lbl">처리 완료</div>${doneItems.map(x => `<div class="dc-on">
      <span class="ck">완료</span>
      <span><b>${esc(x.t)}</b> — ${esc(x.d || "")}</span>
    </div>`).join("")}` : ""}
    ${live ? decFreeHTML() : ""}
    ${d.foot ? `<div class="dc-f">${esc(d.foot)}</div>` : ""}
  </div>`;
}

/* ── 결정 내용 → Google Form 전송 · localStorage 보존 ── */
const FORM = {
  url: "https://docs.google.com/forms/d/e/1FAIpQLSeL46lQ1rAJucK37t7SdA4yjz6RjpHvdLSsCBj8-tvGkxoiPg/formResponse",
  entry: { date: "entry.865276185", item: "entry.1762240180", decision: "entry.260801736", memo: "entry.1170983988" }
};
const DEC_ITEMS = (BRIEF.decide && BRIEF.decide.items) || [];
const DEF_OPTS = ["확인", "보류"];
const TODAY_ISO = ((String(BRIEF.date || "").match(/\d{4}-\d{2}-\d{2}/) || [])[0]) ||
  new Date().toISOString().slice(0, 10);
const DEC_KEY = "apply-board-decide-" + TODAY_ISO;
let DEC_STATE = {};
try{ DEC_STATE = JSON.parse(localStorage.getItem(DEC_KEY) || "{}") || {}; }catch(e){ DEC_STATE = {}; }
try{
  Object.keys(localStorage).forEach(k => { if(k.indexOf("apply-board-decide-") === 0 && k !== DEC_KEY) localStorage.removeItem(k); });
}catch(e){}

function decName(item){ return item.id || item.t; }
function decState(name){
  if(!DEC_STATE[name]) DEC_STATE[name] = {};
  return DEC_STATE[name];
}
function decKeep(){
  try{ localStorage.setItem(DEC_KEY, JSON.stringify(DEC_STATE)); }catch(e){}
}
function decCtrl(i){
  const it = DEC_ITEMS[i] || {}, name = decName(it), st = DEC_STATE[name] || {};
  const opts = (Array.isArray(it.opts) && it.opts.length) ? it.opts : DEF_OPTS;
  return `<div class="dc-acts">${opts.map(o => `<button type="button" class="dc-opt${st.opt === o ? " on" : ""}" data-k="${i}" data-opt="${esc(o)}" aria-pressed="${st.opt === o ? "true" : "false"}">${esc(o)}</button>`).join("")}</div>
    <div class="dc-memo">
      <input type="text" class="dc-in" data-k="${i}" maxlength="200" value="${esc(st.memo || "")}" placeholder="필요 내용 메모 (선택)" aria-label="${esc(name)} 메모">
      <button type="button" class="dc-save" data-k="${i}">저장</button>
    </div>
    <span class="dc-st${st.sentAt ? "" : " hidden"}" data-k="${i}">${st.sentAt ? `저장됨 ✓ (${esc(st.sentOpt || "")})` : ""}</span>`;
}
function decFreeHTML(){
  const st = DEC_STATE["기타 메모"] || {};
  return `<div class="dc-free">
    <div class="dc-memo">
      <input type="text" class="dc-in" id="dcFreeIn" maxlength="300" value="${esc(st.memo || "")}" placeholder="목록에 없는 지시사항 적기" aria-label="기타 메모">
      <button type="button" class="dc-save" id="dcFreeBtn">보내기</button>
    </div>
    <span class="dc-st${st.sentAt ? "" : " hidden"}" id="dcFreeSt">${st.sentAt ? "보냄 ✓" : ""}</span>
  </div>`;
}
function decPost(item, decision, memo){
  const body = new URLSearchParams();
  body.set(FORM.entry.date, TODAY_ISO);
  body.set(FORM.entry.item, item);
  body.set(FORM.entry.decision, decision);
  body.set(FORM.entry.memo, memo || "");
  return fetch(FORM.url, { method: "POST", mode: "no-cors", keepalive: true, body })
    .then(() => true).catch(() => false);
}
function decBadge(el, text, err){
  if(!el) return;
  el.classList.remove("hidden");
  el.classList.toggle("err", !!err);
  el.textContent = text;
}
function decRefresh(name){
  const root = document.querySelector('.dc[data-live="1"]');
  if(!root) return;
  const st = DEC_STATE[name] || {};
  const i = DEC_ITEMS.findIndex(x => decName(x) === name);
  const row = i >= 0 ? root.querySelectorAll(".dc-i")[i] : null;
  if(row && st.sentAt){
    row.classList.remove("wait");
    row.classList.add("done");
    const chip = row.querySelector(".dc-s");
    if(chip) chip.textContent = "완료";
  }
  const cnt = root.querySelector(".dc-n");
  if(cnt){
    const left = DEC_ITEMS.filter(x => x.s !== "done" && !(DEC_STATE[decName(x)] || {}).sentAt).length;
    cnt.textContent = left ? left + "건 대기" : "전부 처리";
  }
  const tl = document.getElementById("tl3");
  if(tl) tl.innerHTML = timelineHTML(BRIEF);
}
function decSendNow(badge, name, decision, memo){
  const st = decState(name);
  st.sentOpt = decision; st.sentMemo = memo; st.sentAt = 0; st.pending = true; decKeep();
  decBadge(badge, "저장 중…", false);
  decPost(name, decision, memo).then(ok => {
    st.pending = false;
    if(ok){ st.sentAt = Date.now(); decBadge(badge, `저장됨 ✓ (${decision})`, false); decRefresh(name); }
    else { st.sentOpt = ""; st.sentMemo = ""; decBadge(badge, "전송 실패 · [저장] 다시", true); }
    decKeep();
  });
}
function decPick(root, i, opt){
  const it = DEC_ITEMS[i]; if(!it) return;
  const name = decName(it), st = decState(name);
  const inp = root.querySelector(`.dc-in[data-k="${i}"]`);
  const memo = inp ? inp.value.trim() : "";
  root.querySelectorAll(`.dc-opt[data-k="${i}"]`).forEach(b => {
    const on = b.dataset.opt === opt;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  st.opt = opt; st.memo = memo; decKeep();
  decSendNow(root.querySelector(`.dc-st[data-k="${i}"]`), name, opt, memo);
}
function decCommit(root, i){
  const it = DEC_ITEMS[i]; if(!it) return;
  const name = decName(it), st = decState(name);
  const inp = root.querySelector(`.dc-in[data-k="${i}"]`);
  const badge = root.querySelector(`.dc-st[data-k="${i}"]`);
  const memo = inp ? inp.value.trim() : "";
  const opt = st.opt || "";
  if(!opt && !memo){ decBadge(badge, "선택하거나 메모를 적어 주세요", true); if(inp) inp.focus(); return; }
  st.memo = memo; decKeep();
  const decision = opt || "메모";
  if(st.sentAt && st.sentOpt === decision && st.sentMemo === memo){ decBadge(badge, `저장됨 ✓ (${decision})`, false); return; }
  decSendNow(badge, name, decision, memo);
}
function decFree(root){
  const inp = root.querySelector("#dcFreeIn"), badge = root.querySelector("#dcFreeSt");
  const memo = inp ? inp.value.trim() : "";
  if(!memo){ if(inp) inp.focus(); return; }
  const st = decState("기타 메모");
  st.memo = memo; decKeep();
  if(st.sentAt && st.sentMemo === memo){ decBadge(badge, "보냄 ✓", false); return; }
  decSendNow(badge, "기타 메모", "메모", memo);
}
function decRootOf(el){
  const root = el && el.closest ? el.closest('.dc[data-live="1"]') : null;
  return root || null;
}
document.addEventListener("click", e => {
  const root = decRootOf(e.target); if(!root) return;
  const opt = e.target.closest ? e.target.closest(".dc-opt") : null;
  if(opt){ decPick(root, Number(opt.dataset.k), opt.dataset.opt); return; }
  const sv = e.target.closest ? e.target.closest(".dc-save") : null;
  if(sv){
    if(sv.id === "dcFreeBtn") decFree(root);
    else decCommit(root, Number(sv.dataset.k));
  }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const inp = e.target.closest ? e.target.closest(".dc-in") : null;
  if(!inp) return;
  const root = decRootOf(inp); if(!root) return;
  e.preventDefault();
  if(inp.id === "dcFreeIn") decFree(root);
  else decCommit(root, Number(inp.dataset.k));
});

       <div class="line" style="margin-top:8px">일정 <b>${esc(sc.count)}건</b> — ${esc(sc.detail || "")}</div>
       ${(sc.reminders || []).map(r => `<div class="li"><span class="lk">${esc(r.t)}</span><span class="lv">${r.d}</span></div>`).join("")}
       <div class="attr" style="margin-top:8px">날씨 <a href="https://developer.apple.com/weatherkit/data-source-attribution/">&#xF8FF; Weather</a> · <a href="https://www.airkorea.or.kr/">AirKorea · 한국환경공단</a></div>`,
      null, false),
    blkHTML("2. 오늘 뉴스", newsSum,
      news.map(n => `<div class="li"><span class="lk"><span class="tag b">${esc(n.cat)}</span></span><span class="lv"><b>${esc(n.t)}</b><span class="d">${esc(n.d)} <a href="${n.url}" target="_blank" rel="noopener noreferrer">${esc(n.src)}</a></span></span></div>`).join("") +
      ((nw.local || []).length ? `<div class="sec-label" style="margin:12px 0 6px">구미 동네 소식 <span>· 공단동·인동 · 교통 이슈 제외</span></div>` +
        nw.local.map(n => `<div class="li"><span class="lv"><b>${esc(n.t)}</b><span class="d">${esc(n.d)}</span></span></div>`).join("") : ""),
      null, false),

/* ── 오늘 핵심 3줄 타임라인 (맨 위 고정 카드) ───────────── */
function shortClause(s, max){
  const t = String(s == null ? "" : s).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim()
    .split(/—|·/)[0].trim();
  return t.length > max ? t.slice(0, max).trim() + "…" : t;
}
function timelineHTML(b){
  const w = b.weather || {}, sc = b.schedule || {}, ml = b.meals || {}, isa = b.isa || {}, jb = b.jobs || {};
  const rem = sc.reminders || [], r0 = rem[0] || {};
  const bold = (String(r0.d || "").match(/<b>(.*?)<\/b>/) || [])[1] || "";
  const isaTxt = txt(isa.stocks);
  const hasBaji = /15:00/.test(ml.todo || ""), hasShin = /신영 계좌/.test(isaTxt) && /마감/.test(isaTxt);
  const dl = [], dlNote = [];
  if((b.deadlines || []).length){
    (b.deadlines || []).filter(x => x.t !== (r0.t || "")).forEach(x => { dl.push({t:x.t, v:x.v}); if(x.n) dlNote.push(x.n); });
  } else {
    if(hasBaji){ dl.push({t:"15:00", v:"바지락 주문"}); dlNote.push("15:00을 넘기면 다음 날 새벽 도착"); }
    if(hasShin){ dl.push({t:"오늘", v:"신영 계좌 개설"}); dlNote.push("신영은 오늘까지 열어야 12/1 청약"); }
  }
  const pend = ((b.decide || {}).items || []).filter(x => x.s !== "done" && !(DEC_STATE[decName(x)] || {}).sentAt);
  const waitN = pend.length;
  const pendName = pend[0] ? String(pend[0].t || "").split("—")[0].trim() : "";
  const rows = [
    { cls:"w", k:"날씨",
      t:`<em>${esc(w.range || "–")}</em>${esc(w.cond || "")}`,
      s:`미세먼지 <b>${esc(w.air || "–")}</b>${/빙판길/.test(w.note || "") ? " · 아침 <b>빙판길</b> 주의" : ""}` },
    { cls:"h", k:"다음 일정",
      t: r0.t ? `<em>${esc(r0.t)}</em>${esc(shortClause(r0.d, 26))}` : "오늘 알림 없음",
      s: `알림 ${rem.length}건` },
    { cls:"c", k:"오늘 마감",
      t: dl.length ? dl.map(x => `<em>${esc(x.t)}</em>${esc(x.v)}`).join("<span style=\"color:var(--sub);font-weight:700\"> · </span>") : (waitN ? "마감 없음" : "오늘 마감 없음"),
      s: dlNote.length ? dlNote.join(" · ") : (waitN ? `남은 결정 ${waitN}건${pendName ? `(${esc(pendName)})` : ""}은 맨 위 박스에서` : "마감이 걸린 항목 없음") }
  ];
  return `<div class="tl3" role="region" aria-label="오늘 핵심 3줄">
    <div class="tl3-h"><b>오늘 핵심 3줄</b></div>
    ${rows.map((x, i) => `<div class="tl3-row ${x.cls}">
      <span class="tl3-n">${i + 1}</span>
      <div class="tl3-b"><div class="tl3-t">${x.t}</div><div class="tl3-s">${x.s}</div></div>
      <span class="tl3-k">${x.k}</span>
    </div>`).join("")}
  </div>`;
}

/* ── 과거 기록 ─────────────────────────────────────────── */
const ARCH_BOX   = document.getElementById("archiveView");
const archSel    = document.getElementById("dateSel");
const pastBanner = document.getElementById("pastBanner");
const pastText   = document.getElementById("pastText");
const ARCH_CACHE = {};
let ARCH_LATEST  = null;

function archToggle(on){
  ARCH_BOX.classList.toggle("hidden", !on);
  pastBanner.classList.toggle("hidden", !on);
  const live = document.getElementById("liveView");
  if(live) live.classList.toggle("hidden", on);
}
function archPaint(date, d){
  const b = (d.today && d.today.brief) || d.today || {};
  archSel.value = date;
  archToggle(true);
  pastText.innerHTML = `과거 기록 열람 중 · <b>${date} (${d.dw || ""})</b>`;
  ARCH_BOX.innerHTML = `
    <div class="arch-date">🕘 그날 기준 · ${esc(b.basis || date)}</div>
    <div class="arch-sum">${esc(d.summary || "")}</div>
    <div style="height:12px"></div>
    ${decideHTML(b.decide, false)}
    ${(b && Object.keys(b).length) ? briefHTML(b) : `<div class="blk"><div class="line muted">이 날은 브리핑 기록이 없음. 다음 기록부터 남음.</div></div>`}`;
  window.scrollTo({top: 0});
}
function archGo(date){
  if(!date) return;
  if(ARCH_CACHE[date]){ archPaint(date, ARCH_CACHE[date]); return; }
  ARCH_BOX.innerHTML = `<div class="loadnote">${date} 기록을 불러오는 중…</div>`;
  fetch("history/" + date + ".json", {cache: "no-store"})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { ARCH_CACHE[date] = j; archPaint(date, j); })
    .catch(() => {
      archToggle(false);
      if(ARCH_LATEST) archSel.value = ARCH_LATEST;
    });
}
function archShowLatest(){
  archToggle(false);
  ARCH_BOX.innerHTML = "";
  if(ARCH_LATEST) archSel.value = ARCH_LATEST;
  if(location.search) history.replaceState(null, "", location.pathname);
}
document.getElementById("toLatest").addEventListener("click", archShowLatest);
archSel.addEventListener("change", () => {
  const v = archSel.value;
  if(!v || v === ARCH_LATEST){ archShowLatest(); return; }
  history.replaceState(null, "", "?d=" + v);
  archGo(v);
});
(function archInit(){
  fetch("history/index.json", {cache: "no-store"})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(idx => {
      const dates = (idx && idx.dates) || [];
      if(!dates.length) throw new Error("empty");
      ARCH_LATEST = dates[0].date;
      archSel.innerHTML = dates.map((x, i) => `<option value="${x.date}">${x.date} (${x.dw})${i === 0 ? " · 최신" : ""}</option>`).join("");
      archSel.value = ARCH_LATEST;
      const want = new URLSearchParams(location.search).get("d");
      if(want && want !== ARCH_LATEST && dates.some(x => x.date === want)) archGo(want);
    })
    .catch(() => {
      archSel.innerHTML = `<option value="2026-11-26">2026-11-26 (목) · 최신</option>`;
      archSel.disabled = true;
    });
})();
</script>
</body>
