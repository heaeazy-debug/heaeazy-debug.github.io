<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>390 검증 하네스(임시)</title>
<style>html,body{margin:0;padding:0;background:#f4f5f7}iframe{display:block;width:390px;border:0}</style></head>
<body>
<iframe id="f"></iframe>
<script>
var f = document.getElementById("f");
f.addEventListener("load", function(){
  try{
    var d = f.contentWindow.document;
    f.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + "px";
  }catch(e){}
});
f.src = "flights.html?t=" + Date.now();
</script>
</body>
</html>
